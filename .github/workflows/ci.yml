name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Slither runs in its own container and needs Foundry inside it. The
      # action only installs Foundry when the target directory contains
      # foundry.toml, so the target must be the project root, not contracts/.
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: '.'
          slither-config: 'slither.config.json'
          fail-on: none
