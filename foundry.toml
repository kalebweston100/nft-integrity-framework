[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Drops the CBOR metadata trailer (absolute paths, compiler settings hash)
# from runtime bytecode so independent compilations of the same source are
# byte-identical. Required for the EXTCODEHASH verification story documented
# in the README ("Verifying a deployment" / "Required compiler settings").
bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
